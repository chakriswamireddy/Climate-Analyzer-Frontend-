name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      TEST_MONGODB_URI: "mongodb://localhost:27017/?directConnection=true"
      REQUIRE_MONGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start MongoDB (single-node replica set, docs/02 §13)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval 'try { rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]}) } catch (e) { print(e.codeName) }'; then
              break
            fi
            sleep 1
          done
          for i in $(seq 1 30); do
            if [ "$(docker exec mongo mongosh --quiet --eval 'try { rs.status().ok } catch (e) { 0 }')" = "1" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "Mongo replica set failed to initiate" >&2
          exit 1
      - name: Install backend (dev)
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Ruff lint
        working-directory: backend
        run: ruff check .
      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .
      - name: Tests
        working-directory: backend
        # P3: full unit + integration suite against the real replica set (docs/04 §9).
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
